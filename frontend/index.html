    function build(idx) {

      if (idx.length < 2) return {

      for (let f = 0; f < P; f++) {
        const vals = [...new Set(idx.map(i => data[i].x[f]))].sort((a, b) => a - b);

/* ---------- pan/zoom time-axis line chart (history solid, forecast dashed) + hover tooltip ---------- */
function Chart({ history, forecastHistory = [], future, latestDate, defaultStart }) {
  const W = 760, H = 320, PL = 56, PR = 20, PT = 24, PB = 40;
  const svgRef = React.useRef(null);
  const MS = 86400000;
  const fullMin = history[0].날짜.getTime();
  const fullMax = future[future.length - 1].날짜.getTime();
  const initStart = Math.max(fullMin, (defaultStart ? defaultStart.getTime() : fullMin));

  const [view, setView] = useState([initStart, fullMax]); // visible time window
  const [hover, setHover] = useState(null);
  const drag = React.useRef(null);
  const [t0, t1] = view;

  const pastForecast = forecastHistory.map((r) => ({ 날짜: r.날짜, v: r.y }));
  const firstPastForecast = pastForecast[0];
  const pastAnchor = firstPastForecast
    ? [...history].reverse().find((r) => r.날짜 < firstPastForecast.날짜)
    : null;
  const pastPredSeries = pastAnchor ? [{ 날짜: pastAnchor.날짜, v: pastAnchor.y }, ...pastForecast] : pastForecast;
  const futurePredSeries = [{ 날짜: latestDate, v: history[history.length - 1].y }, ...future.map((r) => ({ 날짜: r.날짜, v: r.예측가격 }))];
  const clampView = (a, b) => {
    const minSpan = 90 * MS, maxSpan = fullMax - fullMin;
    let span = Math.min(Math.max(b - a, minSpan), maxSpan);
    let start = a, end = a + span;
    if (start < fullMin) { start = fullMin; end = start + span; }
    if (end > fullMax) { end = fullMax; start = end - span; }
    if (start < fullMin) start = fullMin;
    return [start, end];
  };

  // y-axis scales to the currently visible points only
  const visV = history.concat(forecastHistory).concat(future.map((f) => ({ 날짜: f.날짜, y: f.예측가격 })))
    .filter((p) => p.날짜.getTime() >= t0 - MS * 20 && p.날짜.getTime() <= t1 + MS * 20)
    .map((p) => p.y);
  const vmin = Math.min(...visV), vmax = Math.max(...visV);
  const pad = (vmax - vmin) * 0.12 || 1000;
  const lo = Math.floor((vmin - pad) / 1000) * 1000, hi = Math.ceil((vmax + pad) / 1000) * 1000;
  const x = (d) => PL + ((d.getTime() - t0) / (t1 - t0)) * (W - PL - PR);
  const y = (v) => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
  const invX = (px) => t0 + ((px - PL) / (W - PL - PR)) * (t1 - t0);
  const path = (arr, key) => arr.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(p.날짜).toFixed(1)} ${y(p[key]).toFixed(1)}`).join(' ');
  const nTicks = 4;
  const ticks = Array.from({ length: nTicks + 1 }, (_, i) => Math.round(lo + (i / nTicks) * (hi - lo)));
  const years = [...new Set(history.concat(forecastHistory).concat(future).map((r) => r.날짜.getFullYear()))];
  const forecastX = x(latestDate);
  const pts = history.map((h) => ({ d: h.날짜, v: h.y, type: '실제' }))
    .concat(forecastHistory.map((f) => ({ d: f.날짜, v: f.y, type: '예측' })))
    .concat(future.map((f) => ({ d: f.날짜, v: f.예측가격, type: '예측' })));

  const svgCoord = (e) => { const r = svgRef.current.getBoundingClientRect(); return ((e.clientX - r.left) / r.width) * W; };

  const onWheel = (e) => {
    e.preventDefault();
    const sx = svgCoord(e);
    const anchor = invX(sx);
    const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15; // down = zoom out
    const na = anchor - (anchor - t0) * factor;
    const nb = anchor + (t1 - anchor) * factor;
    setView(clampView(na, nb));
  };
  const onDown = (e) => { drag.current = { px: svgCoord(e), t0, t1 }; setHover(null); };
  const onMove = (e) => {
    const sx = svgCoord(e);
    if (drag.current) {
      const dt = (invX(sx) - invX(drag.current.px));
      setView(clampView(drag.current.t0 - dt, drag.current.t1 - dt));
      return;
    }
    let best = null, bd = Infinity;
    for (const p of pts) { const px = x(p.d); if (px < PL || px > W - PR) continue; const dd = Math.abs(px - sx); if (dd < bd) { bd = dd; best = p; } }
    setHover(best);
  };
  const endDrag = () => { drag.current = null; };

  let tip = null;
  if (hover && !drag.current) {
    const hx = x(hover.d), hy = y(hover.v);
    if (hx >= PL && hx <= W - PR) {
      const bw = 128, bh = 46;
      const bx = Math.min(Math.max(hx - bw / 2, PL), W - PR - bw);
      const by = hy - bh - 12 < PT ? hy + 12 : hy - bh - 12;
      tip = (
        <g style={{ pointerEvents: 'none' }}>
          <line x1={hx} x2={hx} y1={PT} y2={H - PB} stroke="#58616a" strokeDasharray="3 3" />
          <circle cx={hx} cy={hy} r="4.5" fill={hover.type === '예측' ? '#256ef4' : '#1e2124'} stroke="#fff" strokeWidth="1.5" />
          <rect x={bx} y={by} width={bw} height={bh} rx="6" fill="#1e2124" />
          <text x={bx + 12} y={by + 18} fontSize="12" fill="#b1b8be">{fmtMonth(hover.d)} · {hover.type}</text>
          <text x={bx + 12} y={by + 36} fontSize="14" fontWeight="700" fill="#fff">{won(hover.v)}</text>
        </g>
      );
    }
  }
  const zoomed = t0 > fullMin + MS || t1 < fullMax - MS;

  return (
    <div style={{ position: 'relative' }}>
      <div style={{ position: 'absolute', top: 0, right: 0, display: 'flex', gap: 6, zIndex: 2 }}>
        <button onClick={() => { const c = (t0 + t1) / 2, s = (t1 - t0) / 2 / 1.4; setView(clampView(c - s, c + s)); }} style={{ width: 32, height: 32, borderRadius: 6, border: '1px solid #b1b8be', background: '#fff', color: '#1e2124', fontSize: 18, fontWeight: 700, cursor: 'pointer', lineHeight: 1 }} aria-label="확대">+</button>
        <button onClick={() => { const c = (t0 + t1) / 2, s = (t1 - t0) / 2 * 1.4; setView(clampView(c - s, c + s)); }} style={{ width: 32, height: 32, borderRadius: 6, border: '1px solid #b1b8be', background: '#fff', color: '#1e2124', fontSize: 18, fontWeight: 700, cursor: 'pointer', lineHeight: 1 }} aria-label="축소">−</button>
        <button onClick={() => setView([initStart, fullMax])} disabled={!zoomed} style={{ height: 32, padding: '0 12px', borderRadius: 6, border: '1px solid #b1b8be', background: zoomed ? '#fff' : '#f4f5f6', color: zoomed ? '#1e2124' : '#b1b8be', fontSize: 13, fontWeight: 700, cursor: zoomed ? 'pointer' : 'default' }}>초기화</button>
      </div>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="과거 실제 배출권 가격과 실행일 기준 향후 1년 예측 곡선. 마우스 휠로 확대·축소, 드래그로 이동."
        onWheel={onWheel} onMouseDown={onDown} onMouseMove={onMove} onMouseUp={endDrag} onMouseLeave={() => { endDrag(); setHover(null); }}
        style={{ touchAction: 'none', cursor: drag.current ? 'grabbing' : 'grab', userSelect: 'none' }}>
        <defs><clipPath id="plotClip"><rect x={PL} y={PT} width={W - PL - PR} height={H - PT - PB} /></clipPath></defs>
        {ticks.map((t) => (
          <g key={t}>
            <line x1={PL} x2={W - PR} y1={y(t)} y2={y(t)} stroke="#e6e8ea" />
            <text x={PL - 10} y={y(t) + 4} textAnchor="end" fontSize="11" fill="#6d7882">{(t / 1000).toLocaleString()}천</text>
          </g>
        ))}
        <g clipPath="url(#plotClip)">
          <rect x={forecastX} y={PT} width={Math.max(0, W - PR - forecastX)} height={H - PT - PB} fill="#ecf2fe" opacity="0.7" />
          <line x1={forecastX} x2={forecastX} y1={PT} y2={H - PB} stroke="#b1cefb" strokeDasharray="3 3" />
          {years.map((yr) => {
            const d = new Date(yr, 0, 1);
            if (d.getTime() < t0 || d.getTime() > t1) return null;
            return <line key={'g' + yr} x1={x(d)} x2={x(d)} y1={PT} y2={H - PB} stroke="#f0f1f2" />;
          })}
          <path d={path(history, 'y')} fill="none" stroke="#58616a" strokeWidth="2" />
          {pastPredSeries.length > 0 && <path d={path(pastPredSeries, 'v')} fill="none" stroke="#256ef4" strokeWidth="2.5" strokeDasharray="6 4" />}
          <path d={path(futurePredSeries, 'v')} fill="none" stroke="#256ef4" strokeWidth="2.5" strokeDasharray="6 4" />
          {forecastHistory.map((r, i) => <circle key={'past' + i} cx={x(r.날짜)} cy={y(r.y)} r="2" fill="#256ef4" />)}
          {future.map((r, i) => <circle key={'future' + i} cx={x(r.날짜)} cy={y(r.예측가격)} r="2" fill="#256ef4" />)}
          {tip}
        </g>
        {forecastX >= PL && forecastX <= W - PR && <text x={Math.min(forecastX + 6, W - PR - 56)} y={PT + 12} fontSize="11" fill="#0b50d0" fontWeight="700">예측 시작</text>}
        {years.map((yr) => {
          const d = new Date(yr, 0, 1);
          if (d.getTime() < t0 || d.getTime() > t1) return null;
          return <text key={yr} x={x(d)} y={H - 12} textAnchor="middle" fontSize="11" fill="#464c53">{yr}</text>;
        })}
      </svg>
    </div>
  );
}

async function apiJson(path, options = {}) {
  if (API_BASE === null) throw new Error('백엔드 연결이 필요한 기능입니다.');
  const response = await fetch(`${API_BASE}/${path}`, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
  return body;
}

const actionStyle = { minHeight: 42, border: 0, borderRadius: 6, background: '#256ef4', color: '#fff', fontWeight: 700, padding: '0 18px', cursor: 'pointer' };

function StatusMessage({ text, error }) {
  if (!text) return null;
  return <div style={{ marginTop: 12, borderRadius: 6, padding: 12, background: error ? '#fdefec' : '#eaf6ec', color: error ? '#bd2c0f' : '#176b2c', fontSize: 14, lineHeight: 1.5 }}>{text}</div>;
}

function SidebarDataManager({ r, onDataChanged }) {
  const inputRef = React.useRef(null);
  const [files, setFiles] = useState([]);
  const [classified, setClassified] = useState([]);
  const [message, setMessage] = useState('');
  const [error, setError] = useState(false);
  const [busy, setBusy] = useState(false);

  const applyFiles = async (next, resetBefore = false) => {
    setBusy(true); setMessage('');
    try {
      if (!next.length) {
        const reset = await apiJson('data/reset', { method: 'POST' });
        setClassified([]); setError(false); setMessage(`기본 데이터 복원 · 학습 ${reset.rows}개월`);
      } else {
        const endpoint = `data/auto-ingest${resetBefore ? '?reset=true' : ''}`;
        const form = new FormData(); next.forEach(file => form.append('files', file));
        const result = await apiJson(endpoint, { method: 'POST', body: form });
        setClassified(result.classified || []); setError(false);
        const update = result.actualUpdate;
        const updateText = update && update.actualMonths
          ? `실제 ${update.actualMonths}개월 반영 · ${update.bridgedMonths || 0}개월 연결 예측 후 재계산`
          : '자동 분석·반영 완료';
        setMessage(`${updateText} · 학습 ${result.rows}개월`);
      }
      onDataChanged();
    } catch (e) {
      setError(true); setMessage(`${e.message} · 기존 그래프는 유지됩니다.`);
    } finally { setBusy(false); }
  };

  const addFiles = (event) => {
    const incoming = Array.from(event.target.files || []);
    const merged = [...files];
    incoming.forEach(file => {
      if (!merged.some(old => old.name === file.name && old.size === file.size && old.lastModified === file.lastModified)) merged.push(file);
    });
    setFiles(merged); event.target.value = ''; applyFiles(merged);
  };
  const removeFile = (index) => {
    const next = files.filter((_, i) => i !== index); setFiles(next); applyFiles(next, true);
  };
  const clearAll = () => { setFiles([]); applyFiles([]); };
  const infoFor = (name) => classified.find(item => item.filename === name);

  return <div>
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
      <span style={{ fontSize: 15, fontWeight: 700 }}>데이터 추가/제거</span>
      {files.length > 0 && <button onClick={clearAll} disabled={busy} style={{ border: 0, background: 'transparent', color: '#246beb', padding: 0, fontSize: 13, cursor: 'pointer' }}>전체 제거</button>}
    </div>
    <div style={{ border: '1px solid #b1b8be', borderRadius: 6, background: '#fff', padding: 10, minHeight: 54 }}>
      {files.length === 0 ? <div style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: 13, minWidth: 0 }}>
        <span style={{ width: 8, height: 8, borderRadius: 99, background: '#228738', flexShrink: 0 }}></span>
        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={r.dataName || DATA_NAME}>{r.dataName || DATA_NAME}</span>
      </div> : files.map((file, index) => {
        const info = infoFor(file.name);
        return <div key={`${file.name}-${index}`} style={{ display: 'grid', gridTemplateColumns: '8px minmax(0,1fr) 22px', gap: 8, alignItems: 'center', padding: '5px 0', borderBottom: index < files.length - 1 ? '1px solid #e6e8ea' : 0 }}>
          <span style={{ width: 8, height: 8, borderRadius: 99, background: info ? '#228738' : '#8a949e' }}></span>
          <span style={{ minWidth: 0 }}><span style={{ display: 'block', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontSize: 13 }} title={file.name}>{file.name}</span>{info && <small style={{ color: '#246beb', fontSize: 11 }}>{info.label}</small>}</span>
          <button aria-label={`${file.name} 제거`} title="제거" onClick={() => removeFile(index)} disabled={busy} style={{ border: 0, background: 'transparent', color: '#58616a', fontSize: 18, cursor: 'pointer', padding: 0 }}>×</button>
        </div>;
      })}
    </div>
    <input ref={inputRef} type="file" multiple accept=".csv,.xlsx,.xls" onChange={addFiles} style={{ display: 'none' }} />
    <button onClick={() => inputRef.current && inputRef.current.click()} disabled={busy} style={{ width: '100%', minHeight: 44, marginTop: 10, border: '1px solid #58616a', borderRadius: 6, background: '#fff', color: '#1e2124', fontSize: 15, fontWeight: 700, cursor: 'pointer' }}>{busy ? '파일 분석 중…' : '파일 선택'}</button>
    <p style={{ margin: '8px 0 0', color: '#6d7882', fontSize: 12, lineHeight: 1.45 }}>실제 가격을 추가하면 해당 월을 실제값으로 교체하고 이후 월을 다시 예측합니다. 원단위·공급·수요 파일도 함께 자동 반영됩니다.</p>
    <StatusMessage text={message} error={error} />
  </div>;
}

function BacktestTool() {
  const [forecastFile, setForecastFile] = useState(null);
  const [actualFile, setActualFile] = useState(null);
  const [result, setResult] = useState(null);
  const [message, setMessage] = useState('');
  const [busy, setBusy] = useState(false);
  const runUploaded = async () => {
    setBusy(true); setMessage('');
    try {
      const form = new FormData(); form.append('forecast', forecastFile); form.append('actual', actualFile);
      setResult(await apiJson('backtest/compare', { method: 'POST', body: form }));
    } catch (e) { setMessage(e.message); setResult(null); } finally { setBusy(false); }
  };
  const runHistorical = async () => {
    setBusy(true); setMessage('');
    try { setResult(await apiJson('backtest/historical?months=12')); }
    catch (e) { setMessage(e.message); setResult(null); } finally { setBusy(false); }
  };
  const metrics = result && (Array.isArray(result.metrics) ? result.metrics : [{ model: '업로드 비교', ...result.metrics }]);
  return <div style={toolCard}>
    <h3 style={{ margin: '0 0 6px', fontSize: 18 }}>8월 예측 오차 백테스트</h3>
    <p style={{ margin: '0 0 14px', color: '#6d7882', fontSize: 14, lineHeight: 1.5 }}>7월에 저장한 예측표와 8월 KRX 실제가를 같은 년월끼리 1:1 비교합니다.</p>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
      <label style={{ fontSize: 14 }}>사전 예측 파일<input type="file" accept=".csv,.xlsx,.xls" onChange={(e) => setForecastFile(e.target.files[0] || null)} style={{ ...fileStyle, marginTop: 6 }} /></label>
      <label style={{ fontSize: 14 }}>KRX 실제가 파일<input type="file" accept=".csv,.xlsx,.xls" onChange={(e) => setActualFile(e.target.files[0] || null)} style={{ ...fileStyle, marginTop: 6 }} /></label>
    </div>
    <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
      <button style={{ ...actionStyle, opacity: (!forecastFile || !actualFile || busy) ? .5 : 1 }} disabled={!forecastFile || !actualFile || busy} onClick={runUploaded}>업로드 파일 비교</button>
      <button style={{ ...actionStyle, background: '#fff', color: '#1e2124', border: '1px solid #8a949e' }} disabled={busy} onClick={runHistorical}>최근 12개월 교차검증</button>
    </div>
    <StatusMessage text={message} error />
    {metrics && <div style={{ overflowX: 'auto', marginTop: 14 }}><table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 14 }}>
      <thead><tr>{['모델', 'MAE', 'RMSE', 'MAPE', '평균 편향'].map(h => <th key={h} style={{ textAlign: 'right', borderBottom: '1px solid #b1b8be', padding: 8 }}>{h}</th>)}</tr></thead>
      <tbody>{metrics.map((m, i) => <tr key={i}>
        <td style={{ padding: 8, fontWeight: 700 }}>{m.model}</td>
        <td style={{ padding: 8, textAlign: 'right' }}>{Math.round(m.MAE).toLocaleString('ko-KR')}원</td>
        <td style={{ padding: 8, textAlign: 'right' }}>{Math.round(m.RMSE).toLocaleString('ko-KR')}원</td>
        <td style={{ padding: 8, textAlign: 'right' }}>{Number(m.MAPE).toFixed(2)}%</td>
        <td style={{ padding: 8, textAlign: 'right' }}>{Math.round(m.BIAS).toLocaleString('ko-KR')}원</td>
      </tr>)}</tbody>
    </table></div>}
  </div>;
}

function App() {
  const [mode, setMode] = useState('auto');
  const [model, setModel] = useState('ols');
  const [simMargin, setSimMargin] = useState(0);
  const [simIntensity, setSimIntensity] = useState(0);
  const [seasonOption, setSeasonOption] = useState('auto');
  const [r, setR] = useState(null);
  const [status, setStatus] = useState('loading'); // loading | ready | error
  const [detail, setDetail] = useState('');
  const [reloadKey, setReloadKey] = useState(0);

  React.useEffect(() => {
    let alive = true;
    if (!r) setStatus('loading');
    const params = { mode, model, simMargin, simIntensity, seasonOption };
    const delay = r ? 150 : 0; // debounce control changes; first load fires immediately
    const timer = setTimeout(() => {
      getForecast(params)
        .then((res) => { if (alive) { setR(res); setStatus('ready'); } })
        .catch((e) => { if (alive) { setDetail(e && e.message ? e.message : '연결 실패'); setStatus('error'); } });
    }, delay);
    return () => { alive = false; clearTimeout(timer); };
    // eslint-disable-next-line
  }, [mode, model, simMargin, simIntensity, seasonOption, reloadKey]);

  if (status === 'error') return <ServerErrorScreen detail={detail} onRetry={() => setReloadKey((k) => k + 1)} />;
  if (!r) return <LoadingScreen />;
  return (
    <Dashboard r={r} mode={mode} setMode={setMode} model={model} setModel={setModel}
      simMargin={simMargin} setSimMargin={setSimMargin} simIntensity={simIntensity} setSimIntensity={setSimIntensity}
      seasonOption={seasonOption} setSeasonOption={setSeasonOption} onDataChanged={() => setReloadKey((k) => k + 1)} />
  );
}

            {/* right */}
            <section style={{ border: '1px solid #b1b8be', borderRadius: 8, background: '#fff', padding: 24, minWidth: 0 }}>
              <h2 style={{ margin: '0 0 4px', fontSize: 19, fontWeight: 700 }}>과거 실제 가격 + 향후 1년 예측 곡선</h2>
              <p style={{ margin: '0 0 16px', fontSize: 15, color: '#6d7882' }}>실선: 실측 · 점선: 실행일 기준 AI 연속 예측 (~{fmtMonth(r.targetEnd)}) · 마우스 휠로 확대·축소, 드래그로 좌우 이동</p>
              <Chart history={r.history} forecastHistory={r.forecastHistory} future={r.future} latestDate={r.latestDate} defaultStart={recentHistory[0].날짜} />
              <div style={{ display: 'flex', gap: 20, marginTop: 16, fontSize: 15, color: '#464c53', flexWrap: 'wrap' }}>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><span style={{ width: 20, height: 2, background: '#58616a' }}></span>과거 실제 가격</span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><span style={{ width: 20, borderTop: '2.5px dashed #256ef4' }}></span>AI 연속 예측 곡선</span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><span style={{ width: 16, height: 12, background: '#ecf2fe', border: '1px solid #b1cefb' }}></span>예측 구간</span>
              </div>
              <div style={{ marginTop: 20, paddingTop: 20, borderTop: '1px solid #e6e8ea', display: 'flex', gap: 24, flexWrap: 'wrap' }}>
                <div><div style={{ fontSize: 13, color: '#6d7882', marginBottom: 4 }}>사용 엔진</div><div style={{ fontSize: 17, fontWeight: 700 }}>{model === 'ols' ? 'OLS 수식 모델' : 'AI 머신러닝 모델'}</div></div>
                <div><div style={{ fontSize: 13, color: '#6d7882', marginBottom: 4 }}>시뮬레이션 방식</div><div style={{ fontSize: 17, fontWeight: 700 }}>{manual ? '사용자 수치 조절' : '자동 가격 예측'}</div></div>
                <div><div style={{ fontSize: 13, color: '#6d7882', marginBottom: 4 }}>예측 개월</div><div style={{ fontSize: 17, fontWeight: 700 }}>{r.next1y.length}개월</div></div>
              </div>
            </section>
          </div>

          <section style={{ marginTop: 24 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap', marginBottom: 12 }}>
              <h2 style={{ margin: 0, fontSize: 19, fontWeight: 700 }}>월별 예측 명세표</h2>
              <div style={{ width: 320, maxWidth: '100%' }}>
                <Button variant="primary" size="large" style={{ width: '100%' }} onClick={downloadCsv}>1년 예측 결과 CSV 파일 다운로드</Button>
              </div>
            </div>
            <div style={{ border: '1px solid #b1b8be', borderRadius: 8, overflow: 'hidden' }}>
              <Table columns={columns} rows={rows} />
            </div>
          </section>
          <AugustPlanTools />
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
